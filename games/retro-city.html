<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nostalgia Arcade — Retro City</title><style>body{margin:0;background:#17100e;color:#ffe5b0;font-family:monospace;display:grid;place-items:center;min-height:100vh}main{width:min(720px,95vw);text-align:center}canvas{width:100%;background:#28211d;border:8px solid #49362a;image-rendering:pixelated}button,a{padding:10px 18px;background:#ffe5b0;color:#17100e;border:0;font:inherit;text-decoration:none;cursor:pointer}p{font-size:12px}</style><main><h2>RETRO CITY // TOP-DOWN DEMO</h2><canvas id=c width=600 height=420></canvas><p>WASD / جهت‌ها برای رانندگی · جمع‌آوری ۱۰ ستاره</p><button onclick="start()">START</button> <a href="../index.html">بازگشت</a></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=420;let car,stars,keys={},run=false,score=0;function reset(){car={x:280,y:330};stars=Array.from({length:10},()=>({x:40+Math.random()*520,y:50+Math.random()*300,on:1}));score=0}function draw(){x.fillStyle='#28211d';x.fillRect(0,0,W,H);x.fillStyle='#3b4a3a';for(let i=0;i<12;i++)x.fillRect((i%4)*155+20,Math.floor(i/4)*140+20,110,90);x.fillStyle='#6c6254';x.fillRect(0,285,W,55);x.fillStyle='#d4a15c';for(let i=0;i<10;i++)x.fillRect(i*70+10,310,35,5);stars.forEach(s=>{if(s.on){x.fillStyle='#ffd85a';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill()}});x.fillStyle='#d34b36';x.fillRect(car.x,car.y,34,20);x.fillStyle='#111';x.fillRect(car.x+5,car.y-5,24,7);x.fillStyle='#ffe5b0';x.fillText('STARS '+score+'/10',15,20)}function tick(){if(!run)return;let dx=(keys.ArrowRight||keys.d?3:0)-(keys.ArrowLeft||keys.a?3:0),dy=(keys.ArrowDown||keys.s?3:0)-(keys.ArrowUp||keys.w?3:0);car.x=Math.max(0,Math.min(W-34,car.x+dx));car.y=Math.max(25,Math.min(H-30,car.y+dy));stars.forEach(s=>{if(s.on&&Math.hypot(s.x-(car.x+17),s.y-(car.y+10))<18){s.on=0;score++}});if(score===10){run=false;alert('MISSION COMPLETE!')}draw();requestAnimationFrame(tick)}function start(){reset();run=true;tick()}document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);reset();draw();</script></html>
