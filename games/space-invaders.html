<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nostalgia Arcade — Space Invaders</title><style>body{margin:0;background:#050509;color:#9eff8f;font-family:monospace;display:grid;place-items:center;min-height:100vh}main{width:min(720px,95vw);text-align:center}canvas{width:100%;background:#020503;border:8px solid #243622;image-rendering:pixelated}button,a{padding:10px 18px;background:#9eff8f;color:#071007;border:0;font:inherit;text-decoration:none;cursor:pointer}p{font-size:12px}</style><main><h2>ARCADE // SPACE INVADERS</h2><canvas id=c width=600 height=420></canvas><p>← → حرکت · SPACE شلیک / شروع</p><button onclick="start()">START</button> <a href="../index.html">بازگشت</a></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=420;let ship,shots,enemies,run=false,left=false,right=false,score=0;function reset(){ship={x:280};shots=[];enemies=[];score=0;for(let r=0;r<3;r++)for(let q=0;q<8;q++)enemies.push({x:70+q*62,y:50+r*38,w:30,h:20,on:1})}function draw(){x.fillStyle='#020503';x.fillRect(0,0,W,H);x.fillStyle='#9eff8f';x.fillText('SCORE '+score,15,20);x.fillRect(ship.x,385,40,10);shots.forEach(s=>x.fillRect(s.x,s.y,3,10));enemies.forEach(e=>{if(e.on)x.fillRect(e.x,e.y,e.w,e.h)})}function tick(){if(!run)return;if(left)ship.x-=5;if(right)ship.x+=5;ship.x=Math.max(0,Math.min(W-40,ship.x));shots.forEach(s=>s.y-=7);for(const s of shots)for(const e of enemies)if(e.on&&s.x>e.x&&s.x<e.x+e.w&&s.y>e.y&&s.y<e.y+e.h){e.on=0;s.y=-20;score+=10}shots=shots.filter(s=>s.y>-20);let edge=enemies.filter(e=>e.on).some(e=>e.x<10||e.x>W-40);if(edge)enemies.forEach(e=>e.x+=e.x<300?5:-5);enemies.forEach(e=>e.y+=.12);if(enemies.every(e=>!e.on)){run=false;alert('YOU WIN — '+score)}if(enemies.some(e=>e.on&&e.y>360)){run=false;alert('GAME OVER — '+score)}draw();requestAnimationFrame(tick)}function start(){reset();run=true;tick()}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.code==='Space'){e.preventDefault();if(!run)start();else shots.push({x:ship.x+20,y:375})}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});reset();draw();</script></html>
