<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nostalgia Arcade — Snake</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090d0b;color:#b8ff9d;font-family:monospace;display:grid;place-items:center;padding:20px;overflow:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(184,255,157,.025) 4px);z-index:5}.cabinet{width:min(680px,96vw);background:#111713;border:2px solid #42623a;border-radius:18px;padding:20px;box-shadow:0 0 60px #152b16,0 0 0 8px #080b09}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35522f;padding:0 4px 14px;margin-bottom:16px}.logo{font-size:14px;letter-spacing:3px}.score{font-size:14px}.screen{position:relative;background:#030604;border:10px solid #263524;border-radius:8px;padding:10px;box-shadow:inset 0 0 35px #10230f}.screen canvas{display:block;width:100%;aspect-ratio:1;background:#050905;image-rendering:pixelated}.overlay{position:absolute;inset:10px;display:grid;place-items:center;text-align:center;background:rgba(0,10,0,.78);font-size:20px;line-height:2}.overlay.hidden{display:none}.overlay button,.back{font:inherit;color:#0a1009;background:#b8ff9d;border:0;padding:9px 18px;cursor:pointer;font-weight:bold}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:11px;color:#76966d}.pad{display:grid;grid-template-columns:repeat(3,38px);gap:4px;direction:ltr}.pad button{height:34px;background:#172016;border:1px solid #42623a;color:#b8ff9d;cursor:pointer}.pad button:nth-child(2){grid-column:2}.pad button:nth-child(3){grid-column:1;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:2}.pad button:nth-child(5){grid-column:3;grid-row:2}@media(min-width:700px){.pad{display:none}}.back{display:inline-block;text-decoration:none;background:transparent;color:#b8ff9d;border:1px solid #42623a;margin-top:16px;font-size:11px}.hint{text-align:center;font-size:10px;color:#60775b;margin-top:10px}</style></head><body><div class="cabinet"><div class="top"><div class="logo">NOSTALGIA // ARCADE</div><div class="score">SCORE <b id="score">00000</b></div></div><div class="screen"><canvas id="game" width="400" height="400"></canvas><div class="overlay" id="overlay"><div><div id="message">SNAKE</div><button id="start">PRESS START</button></div></div></div><div class="controls"><span>ARROWS / WASD · SPACE = PAUSE</span><div class="pad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div></div><a class="back" href="../index.html">← بازگشت به آرکید</a><div class="hint">یک بازی کوچک ساخته‌شده برای آرشیو نوستالژی</div></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),S=20,N=20;let snake,food,dir,next,score,running=false,paused=false,timer;const overlay=document.getElementById('overlay'),message=document.getElementById('message'),scoreEl=document.getElementById('score');function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;place();scoreEl.textContent='00000';draw()}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function draw(){x.fillStyle='#050905';x.fillRect(0,0,400,400);x.strokeStyle='rgba(120,255,100,.035)';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,400);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(400,i*S);x.stroke()}x.fillStyle='#ff6b55';x.shadowBlur=14;x.shadowColor='#ff6b55';x.fillRect(food.x*S+5,food.y*S+5,10,10);x.shadowBlur=0;snake.forEach((p,i)=>{x.fillStyle=i?'#72b85d':'#b8ff9d';x.fillRect(p.x*S+2,p.y*S+2,16,16)})}function tick(){if(!running||paused)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=String(score).padStart(5,'0');place()}else snake.pop();draw()}function gameOver(){running=false;clearInterval(timer);message.innerHTML='GAME OVER<br><small>SCORE '+String(score).padStart(5,'0')+'</small>';overlay.classList.remove('hidden')}function start(){reset();running=true;paused=false;message.textContent='SNAKE';overlay.classList.add('hidden');clearInterval(timer);timer=setInterval(tick,105)}function setDir(d){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];if(m&&!(m.x===-dir.x&&m.y===-dir.y))next=m}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='enter'&&!running)start();if(k===' '){e.preventDefault();paused=!paused}if(k==='arrowup'||k==='w')setDir('up');if(k==='arrowdown'||k==='s')setDir('down');if(k==='arrowleft'||k==='a')setDir('left');if(k==='arrowright'||k==='d')setDir('right')});document.getElementById('start').onclick=start;document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>setDir(b.dataset.d));reset();</script></body></html>
