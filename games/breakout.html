<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nostalgia Arcade — Breakout</title><style>body{margin:0;background:#090909;color:#f5e8c8;font-family:monospace;display:grid;place-items:center;min-height:100vh}main{width:min(720px,95vw);text-align:center}canvas{width:100%;background:#101010;border:8px solid #332d24;image-rendering:pixelated;box-shadow:0 0 40px #000}button,a{padding:10px 18px;background:#f5e8c8;color:#111;border:0;font:inherit;text-decoration:none;cursor:pointer}p{font-size:12px}</style><main><h2>ATARI // BREAKOUT</h2><canvas id=c width=600 height=400></canvas><p>← → برای حرکت · SPACE شروع / توقف</p><button id=s>START</button> <a href="../index.html">بازگشت</a></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=400;let p,ball,bricks,run=false,left=false,right=false,score=0;function reset(){p={x:260,w:80};ball={x:300,y:340,dx:3,dy:-3,r:6};bricks=[];score=0;for(let r=0;r<5;r++)for(let q=0;q<9;q++)bricks.push({x:28+q*61,y:35+r*25,w:50,h:15,on:1})}function draw(){x.fillStyle='#101010';x.fillRect(0,0,W,H);x.fillStyle='#f5e8c8';bricks.forEach(b=>{if(b.on)x.fillRect(b.x,b.y,b.w,b.h)});x.fillRect(p.x,370,p.w,10);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.fillText('SCORE '+score,15,20)}function tick(){if(!run)return;if(left)p.x-=6;if(right)p.x+=6;p.x=Math.max(0,Math.min(W-p.w,p.x));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<6||ball.x>W-6)ball.dx*=-1;if(ball.y<6)ball.dy*=-1;if(ball.y>360&&ball.x>p.x&&ball.x<p.x+p.w)ball.dy=-Math.abs(ball.dy);for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=0;ball.dy*=-1;score+=10}if(ball.y>H){run=false;alert('GAME OVER — SCORE '+score)}if(bricks.every(b=>!b.on)){run=false;alert('YOU WIN — SCORE '+score)}draw();requestAnimationFrame(tick)}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true;if(e.code==='Space'){e.preventDefault();run=!run;if(run)tick()}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});s.onclick=()=>{reset();run=true;tick()};reset();draw();</script></html>
